[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app_common_utils"
version = "0.1.5"
description = "Common utilities for FastAPI services"
readme = "README.md"
requires-python = ">=3.10"
license =  "MIT"
authors = [{ name = "Shahaji Nangare", email = "shahaji.nangare@magentamobility.com" }]

dependencies = [
  "fastapi[standard]>=0.113.0,<0.114.0",
  "pydantic>=2.7.0,<3.0.0",
  "pydantic-settings>=2.12.0",
  "sqlalchemy[asyncio]>=2.0.45",
  "pymysql>=1.1.2",
  "aiomysql>=0.3.2"
]

[project.urls]
Homepage = "https://magentamobility.com/app-common-utils"
Repository = "https://github.com/shahajinangare/app-common-utils"